predictor_type: onn_causal_recurrent
mask_mode: unified_random

pretrain:
  enc_checkpoint_key: encoder
  pred_checkpoint_key: predictor
  model_name: vit_large
  patch_size: 16
  folder: /data/linux/wkx/IntPhys/references_code/references/checkpoints/vjepa
  checkpoint: vitl16.pth.tar
  write_tag: vjepa_vitl16_onn_causal_recurrent_slm3
  use_sdpa: true
  use_silu: false
  wide_silu: false
  uniform_power: true
  is_causal: false
  pred_is_causal: false
  pred_depth: 12
  tubelet_size: 2
  frames_per_clip: 16

data:
  batch_size: 15
  resolution: 224
  stride_sliding_window: 2
  use_bfloat16: true
  frames_per_clip: 16
  context_lengths: [2]
  frame_steps: 2

data_split:
  source: train
  manifest: /data/linux/wkx/IntPhys/references_code/references/splits/intphys_train_2000_val_200.json
  num_train_videos: 2000
  num_val_videos: 200
  split_seed: 42

training:
  mode: end_to_end_jepa
  experiment_mode: onn_causal_recurrent
  epochs: 25
  checkpoint_selection: validation_best
  split_manifest: /data/linux/wkx/IntPhys/references_code/references/splits/intphys_train_2000_val_200.json
  last_output: null
  clip_grad: 10.0

predictor:
  context_dim: 1024
  predictor_dim: 384
  num_chunks: 8
  num_context_chunks: 7
  chunk_frames: 2
  chunk_tokens: 196
  memory_lambda: 0.4  # current input 0.6, historical memory 0.4
  freeze_predictor_embed: true

onn:
  input_dim: 384
  output_dim: 384
  num_slm_layers: 3
  chunk_tokens: 196
  grid_height: 196
  grid_width: 384
  feedback_mode: fixed_middle_phase
  feedback_enabled: false
  feedback_memory_enabled: false
  feedback_memory_alpha: 0.8
  feedback_layer_mode: single
  feedback_layer_index: 1
  feedback_phase_max_rad: 1.5707963267948966
  feedback_gain_init: 0.33
  feedback_sign: 1.0
  readout_mode: learnable_offset
  learnable_intensity_offset: true
  use_differential_detector: false
  pixel_pitch_um: 8.0
  wavelength_nm: 532.0
  slm_intervals_um: [25000.0, 25000.0]
  input_to_first_slm_um: 50000.0
  last_slm_to_detector_um: 50000.0
  asm_padding_factor: 2.0
  input_encoding_mode: signed_phase

loss:
  loss_exp: 1.0
  motion_beta: 1.0
  motion_epsilon: 1.0e-6

evaluation:
  run_after_training: true
  primary_score: unweighted_prediction_error
  spatial_reduction: mean
  temporal_reduction: mean
  spatial_top_n: 20
  temporal_top_n: 2
  save_motion_weighted: true
  save_motion_only: true
  save_copy_baseline: true
  last_context_copy_baseline: false

tag: vjepa_vitl16_onn_causal_recurrent_slm3
nodes: 1
tasks_per_node: 1
eval_name: intuitive_physics
dataset: intphys
